<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Task Planner</title>
  <!-- Bootstrap 5 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 650px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="text-center mb-1">Daily Task Planner</h2>
        <p id="currentDate" class="text-center text-muted mb-4 fw-medium"></p>

        <!-- Input Form -->
        <form id="taskForm" class="input-group mb-3">
          <input 
            type="text" 
            id="taskInput" 
            class="form-control" 
            placeholder="Add a new task..." 
            required 
          />
          <button class="btn btn-primary" type="submit">Add Task</button>
        </form>

        <!-- Filters -->
        <div class="d-flex justify-content-center gap-2 mb-3">
          <button class="btn btn-sm btn-outline-primary active" id="filterAll">All</button>
          <button class="btn btn-sm btn-outline-primary" id="filterPending">Pending</button>
          <button class="btn btn-sm btn-outline-primary" id="filterCompleted">Completed</button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="list-group"></ul>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
